name: Build and Release

on:
  push:
    branches:
      - "**"
      - "!ci/linux-build-image"
    tags:
      - "*"
      - "!ios-v*"
      - "!android-v*"
      - "!cli-v*"
      - "!mcp-v*"
  workflow_dispatch:
    inputs:
      desktop_version:
        description: "Desktop version for branch builds, e.g. 1.7.2. Leave blank for the source version; tags use their own version."
        required: false
        type: string
      patch:
        description: "Hotfix patch number, for example 1 or 2. Use 0 for a normal build."
        required: false
        default: "0"
      sign_windows_test:
        description: "Submit the Windows installer to SignPath using test-signing."
        required: false
        type: boolean
        default: false
      sign_macos:
        description: "Sign and notarize macOS installers (automatic for v* release tags)."
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  XMAKE_MIN_VERSION: "3.1.1"
  CROSSDESK_UPDATE_PUBLIC_KEY: ${{ vars.CROSSDESK_UPDATE_PUBLIC_KEY }}
  CROSSDESK_DESKTOP_VERSION: ${{ inputs.desktop_version }}

jobs:
  prepare-version:
    name: Resolve desktop version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Resolve the date once for every desktop build and the release job.
    steps:
      - uses: actions/checkout@v5
      - name: Check shared client version
        run: python3 scripts/version.py check client
      - name: Resolve desktop version
        id: version
        shell: bash
        env:
          PATCH_NUMBER: ${{ inputs.patch || '0' }}
        run: |
          VERSION_REF="${GITHUB_REF##*/}"
          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            VERSION_REF="${CROSSDESK_DESKTOP_VERSION:-$(python3 scripts/version.py show desktop --field version)}"
            if [[ ! "${VERSION_REF}" =~ ^v?[0-9]+(\.[0-9]+){1,3}$ ]]; then
              echo "::error::desktop_version must be a numeric version such as 1.7.2"
              exit 1
            fi
          elif [[ -n "${CROSSDESK_DESKTOP_VERSION}" ]]; then
            echo "::error::desktop_version is only supported for branch builds; tags determine release versions"
            exit 1
          fi
          VERSION_BASE="${VERSION_REF#v}"
          BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)

          if [[ ! "${PATCH_NUMBER}" =~ ^[0-9]+$ ]]; then
            PATCH_NUMBER=0
          fi

          if [[ "${VERSION_BASE}" =~ ^([0-9]+(\.[0-9]+){1,3})-([0-9]+)-([0-9]{8})$ ]]; then
            VERSION_BASE="${BASH_REMATCH[1]}"
            PATCH_NUMBER="${BASH_REMATCH[3]}"
            BUILD_DATE="${BASH_REMATCH[4]}"
          elif [[ "${VERSION_BASE}" =~ ^([0-9]+(\.[0-9]+){1,3})-([0-9]{8})-([0-9]+)$ ]]; then
            VERSION_BASE="${BASH_REMATCH[1]}"
            BUILD_DATE="${BASH_REMATCH[3]}"
            PATCH_NUMBER="${BASH_REMATCH[4]}"
          elif [[ "${VERSION_BASE}" =~ ^([0-9]+(\.[0-9]+){1,3})-([0-9]{8})$ ]]; then
            VERSION_BASE="${BASH_REMATCH[1]}"
            BUILD_DATE="${BASH_REMATCH[3]}"
          elif [[ "${VERSION_BASE}" =~ ^([0-9]+(\.[0-9]+){1,3})-([0-9]+)$ && "${PATCH_NUMBER}" == "0" ]]; then
            VERSION_BASE="${BASH_REMATCH[1]}"
            PATCH_NUMBER="${BASH_REMATCH[3]}"
          fi

          if [[ "${PATCH_NUMBER}" != "0" ]]; then
            VERSION_NUM="v${VERSION_BASE}-${PATCH_NUMBER}-${BUILD_DATE}"
          else
            VERSION_NUM="v${VERSION_BASE}-${BUILD_DATE}"
          fi

          echo "version=${VERSION_NUM}" >> "$GITHUB_OUTPUT"
          echo "Desktop version: ${VERSION_NUM}"

  build-macos:
    name: Build on macOS
    needs: prepare-version
    runs-on: ${{ matrix.runner }}
    env:
      VERSION_NUM: ${{ needs.prepare-version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      EXPECTED_MACOS_SDK: "26.5"
      MACOS_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign_macos) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            binary_arch: arm64
            runner: macos-26
            cache-key: arm-macos26-xcode26.6-min14
            out-dir: ./build/macosx/arm64/release/crossdesk
            package_script: ./apps/desktop/scripts/macos/pkg_arm64.sh

    steps:
      - name: Validate macOS signing secrets
        if: env.MACOS_SIGNING_REQUIRED == 'true'
        shell: bash
        env:
          MACOS_APP_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in MACOS_APP_CERTIFICATE_P12_BASE64 MACOS_INSTALLER_CERTIFICATE_P12_BASE64 \
            MACOS_P12_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Select Xcode 26.6
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          if [[ "${SDK_VERSION}" != "${EXPECTED_MACOS_SDK}" ]]; then
            echo "Unexpected macOS SDK: expected ${EXPECTED_MACOS_SDK}, got ${SDK_VERSION}" >&2
            exit 1
          fi

      - name: Cache xmake dependencies
        uses: actions/cache@v5
        with:
          path: ~/.xmake/packages
          key: "${{ runner.os }}-xmake-deps-${{ matrix.cache-key }}-${{ github.run_id }}"
          restore-keys: |
            ${{ runner.os }}-xmake-deps-${{ matrix.cache-key }}-

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Ensure minimum Xmake version
        uses: ./.github/actions/ensure-xmake
        with:
          minimum-version: ${{ env.XMAKE_MIN_VERSION }}

      - name: Update xmake repositories
        run: xmake repo -u

      - name: Build CrossDesk
        run: |
          xmake f --target_minver=${MACOSX_DEPLOYMENT_TARGET} --CROSSDESK_VERSION=${VERSION_NUM} --USE_CUDA=false -vyD
          xmake b -vy crossdesk

      - name: Import Developer ID certificates and notarization credentials
        id: macos_signing
        if: env.MACOS_SIGNING_REQUIRED == 'true'
        shell: bash
        env:
          MACOS_APP_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/setup_macos_signing.sh

      - name: Package CrossDesk app
        id: macos_package
        run: |
          chmod +x ${{ matrix.package_script }}
          ${{ matrix.package_script }} ${VERSION_NUM}

      - name: Verify packaged app
        shell: bash
        run: |
          PACKAGE_FILE="${GITHUB_WORKSPACE}/crossdesk-macos-${{ matrix.arch }}-${VERSION_NUM}.pkg"
          VERIFY_DIR="$(mktemp -d "${RUNNER_TEMP}/crossdesk-macos-pkg.XXXXXX")"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT

          pkgutil --expand-full "${PACKAGE_FILE}" "${VERIFY_DIR}/expanded"
          APP_PATH="$(find "${VERIFY_DIR}/expanded" -type d -name 'CrossDesk.app' -print -quit)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "CrossDesk.app is missing from ${PACKAGE_FILE}" >&2
            exit 1
          fi

          ./apps/desktop/scripts/macos/verify_app.sh "${APP_PATH}" "${{ matrix.binary_arch }}" "${EXPECTED_MACOS_SDK}"

      - name: Notarize and staple macOS installer
        id: macos_notarization
        if: env.MACOS_SIGNING_REQUIRED == 'true'
        timeout-minutes: 65
        shell: bash
        env:
          CROSSDESK_MACOS_NOTARY_PROFILE: ${{ steps.macos_signing.outputs.notary_profile }}
          CROSSDESK_MACOS_NOTARY_TIMEOUT: 60m
          CROSSDESK_MACOS_NOTARY_S3_ACCELERATION: "false"
        run: |
          bash ./apps/desktop/scripts/macos/notarize_pkg.sh \
            "crossdesk-macos-${{ matrix.arch }}-${VERSION_NUM}.pkg"

      - name: Upload macOS notarization diagnostics
        if: always() && env.MACOS_SIGNING_REQUIRED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: macos-notarization-${{ matrix.arch }}-${{ env.VERSION_NUM }}
          path: crossdesk-macos-${{ matrix.arch }}-${{ env.VERSION_NUM }}.pkg.notary*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve signed installer after notarization failure
        if: failure() && env.MACOS_SIGNING_REQUIRED == 'true' && steps.macos_package.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: macos-pending-notarization-${{ matrix.arch }}-${{ env.VERSION_NUM }}
          path: crossdesk-macos-${{ matrix.arch }}-${{ env.VERSION_NUM }}.pkg
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: crossdesk-macos-${{ matrix.arch }}-${{ env.VERSION_NUM }}
          path: crossdesk-macos-${{ matrix.arch }}-${{ env.VERSION_NUM }}.pkg
          if-no-files-found: error

      - name: Move files to release dir
        run: |
          mkdir -p release
          cp crossdesk-macos-${{ matrix.arch }}-${{ env.VERSION_NUM }}.pkg release/

      - name: Remove macOS signing credentials
        if: always() && env.MACOS_SIGNING_REQUIRED == 'true'
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/crossdesk-macos-signing/signing.keychain-db" 2>/dev/null || true
          rm -rf "${RUNNER_TEMP:?}/crossdesk-macos-signing"

